name: Check upstreams

on:
  schedule:
    # Hourly. The cost of checking is one API call per package; the cost of not
    # checking is that a security fix upstream sits unnoticed.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: owfeed-update
  cancel-in-progress: false

jobs:
  # Land what last hour's run already proved, before looking for anything new.
  #
  # A trusted update no longer arrives as a pull request, because a pull request a
  # bot opens cannot merge itself here: GitHub creates its `pull_request` run in
  # `action_required` -- "when a workflow using `GITHUB_TOKEN` creates or updates a
  # pull request, the resulting `pull_request` event creates workflow runs in an
  # approval-required state" -- and that reached this organisation between
  # 2026-08-30 20:43Z and 2026-09-01 10:08Z, measured on `attempts/1` of the runs on
  # the `update/*` branches either side of it. It is NOT `fork-pr-contributor-approval`:
  # relaxed to `first_time_contributors_new_to_github` at repository and organisation
  # level at once, the bot's #60 still came back `attempt 1 = action_required` (run
  # 33966648498). Both policies were put back. Issue #53.
  #
  # `tools/check-updates.sh` pushes the branch and dispatches its checks; this pushes
  # the branch's commit onto `main` once they are green. `main`'s branch protection
  # is what enforces them -- a push with a red required context is refused with
  # GH006 -- so the checks a merge would have waited for are the checks this waits
  # for, and `tools/land-updates.sh` refuses on paths before GitHub is even asked.
  #
  # A separate job rather than a step inside `check-updates.sh`, for three reasons:
  # it iterates over branches while that script iterates over packages; it needs
  # neither `pull-requests: write` nor `actions: write`, and a job is where that
  # narrowing is expressed; and it must run on an hour when no upstream released
  # anything, which is most hours -- the branch it lands was pushed by an earlier
  # run and its checks finished long after that run ended.
  #
  # First, so a branch that went green in the last hour is on `main` before
  # `check-updates.sh` compares anything against `main`, and before the publish job
  # below asks whether `main` has been published. `!cancelled()` rather than
  # `success()`: a failure here is a branch that did not land, and it must not stop
  # the hourly check from finding new releases.
  land:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is the push to `main`. The other two are reads: the
      # branch's own check runs, and whether a pull request is open on it -- an open
      # one means a person is the gate and this job leaves it alone. Nothing here
      # opens, merges or closes a pull request, and nothing here starts a workflow.
      contents: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history: this compares an update branch against `main` and
          # refuses on any path but `packages/*/upstream.sh`, and a shallow clone
          # has no merge base to compare across.
          fetch-depth: 0

      - name: Land update branches whose checks have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/land-updates.sh

  check:
    needs: land
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # `actions: write` is one thing: `check-updates.sh` dispatches `pr.yml` on every
    # update branch it pushes, because GitHub will not start those checks by itself.
    # For a trusted update that dispatch is the only run the commit ever gets -- no
    # pull request is opened, so no `pull_request` event exists -- and the `land` job
    # above will not touch a commit with no green contexts. For an untrusted one it
    # is the old reason: a pull request authored by `app/github-actions` gets a
    # `pull_request` run held in `action_required` until a person approves it
    # (measured on #45, and again on #60 with the approval policies relaxed).
    # Without this scope the dispatch is a 403, and nothing on the branch ever runs.
    #
    # Written out in full rather than added to: naming any scope in a job-level
    # block sets every scope this job does not name to none, so the two the
    # workflow already grants have to be repeated here or pushing the branch and
    # opening the pull request stop working.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Look for new upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "owfeed-bot"
          git config user.email "owfeed-bot@users.noreply.github.com"
          ./tools/check-updates.sh

  # An update that lands by itself leaves the feed unpublished, and nothing says so.
  #
  # `publish.yml` triggers on `push: branches: [main]`. The push onto `main` is made
  # by the `land` job under this workflow's GITHUB_TOKEN, and "events triggered by
  # the GITHUB_TOKEN will not create a new workflow run" -- so the push lands on
  # `main` and the trigger does not. `Check upstreams` goes green, `main` carries the
  # new version, and repo.owfeed.org keeps serving the previous one until somebody
  # dispatches Publish by hand. A router upgrading in that window gets the old
  # package.
  #
  # `workflow_dispatch` is the one way out that does not need a credential: it is
  # named in GitHub's own exception -- "`workflow_dispatch` and `repository_dispatch`
  # events always create workflow runs" -- so a dispatch from GITHUB_TOKEN runs where
  # its push would not. The neighbouring trigger, `pull_request_target: closed`, is
  # not an option twice over: a merge made by GITHUB_TOKEN raises no `pull_request`
  # run either (`closed` is not among the exceptions), and it would put the `feed`
  # environment -- the signing keys -- behind an event any pull request can reach.
  #
  # Why it asks whether `main` is published rather than dispatching right after the
  # `land` job: because that job is not the only way a commit reaches `main`. A
  # maintainer merging an untrusted update raises the push event and Publish starts
  # by itself; the `land` job's push raises nothing; and a run where `land` pushed
  # nothing may still find a `main` that no Publish run covers, because an earlier
  # dispatch failed. Comparing `main` against the commits Publish has already run for
  # answers all three with one question, and is idempotent: where the push event did
  # fire, that run exists for the commit and this dispatches nothing.
  publish:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # No checkout, on purpose. `actions: write` is what dispatching a workflow costs,
    # and this job never has a working tree for it to be in scope with. The keys stay
    # where they were: the dispatched run reaches `environment: feed`, this one holds
    # nothing but the right to start it.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Publish main if no Publish run covers it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)"

          # `-R` on every gh call, because this job has no checkout: gh falls back to
          # `git remote` to decide which repository it is talking about, and without a
          # working tree that is `failed to determine base repo: fatal: not a git
          # repository`. Measured -- the first run of this job failed exactly there.
          #
          # The list is captured rather than piped into grep for the same reason. A
          # pipeline reports the exit status of its last command, so a failing
          # `gh run list` reached grep as empty output and read as "no Publish run has
          # ever covered this commit" -- the one answer that makes this job dispatch.
          # An error that turns into a false negative is worse than an error that stops.
          runs="$(gh run list -R "$GITHUB_REPOSITORY" --workflow publish.yml \
                    --branch main --limit 20 --json headSha -q '.[].headSha')"

          # Any status, not just success: one publish attempt per commit. A failed
          # publish is red and visible; re-dispatching it every hour would be an
          # hourly red run that fails for the same reason each time.
          if printf '%s\n' "$runs" | grep -qxF "$head"; then
            echo "main $head already has a Publish run"
            exit 0
          fi

          echo "main $head has no Publish run: dispatching"
          gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref main
