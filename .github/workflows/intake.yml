name: Intake

# Read a package request and answer it, before a person spends time on it.
#
# NO SECRETS IN THIS WORKFLOW, and that is structural rather than tidy. It runs on
# `issues`, which anybody can open, and it fetches and inspects a URL that the issue
# body chose. A signing key in scope here would be a key any stranger can aim work
# at. The checks it runs need no key: verifying a manifest uses a public half, and
# the public half comes out of the issue itself.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'package-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:`: since owfeed v0.5.3 setup installs the release it is pinned
      # at, so this line is the whole pin and a dependabot bump moves the binary too.
      - uses: owfeed/owfeed/setup@v0.5.3

      - name: Read the request and answer it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via a file, never interpolated into the script: an issue body is
          # attacker-controlled text and `${{ }}` would paste it into the shell.
          BODY: ${{ github.event.issue.body }}
        run: |
          set -eu
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          rc=0
          ./tools/intake-check.sh "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/verdict.md" || rc=$?
          # 8 is an upstream outage (tools/net.sh): nothing was decided, and the
          # requester has nothing to fix. Anything else non-zero is a bug here.
          if [ "$rc" -eq 8 ]; then
            {
              echo "## Automated intake check"
              echo
              echo "GitHub or the manifest's host did not answer while this ran, so nothing was checked yet. You do not need to change anything; editing the issue or a maintainer's rerun checks it again."
            } > "$RUNNER_TEMP/verdict.md"
          elif [ "$rc" -ne 0 ]; then
            {
              echo "## Automated intake check"
              echo
              echo "The check itself failed to run. That is a bug here, not in your request."
            } > "$RUNNER_TEMP/verdict.md"
          fi
          cat "$RUNNER_TEMP/verdict.md"
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$RUNNER_TEMP/verdict.md"
