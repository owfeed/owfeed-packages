name: Check

# The same workflow that publishes this feed, in the mode that publishes nothing.
#
# It used to be a hand-written copy of the publish pipeline, which meant a green
# pull request proved something about a pipeline nobody publishes with. Calling
# owfeed's reusable workflow with `dry-run: true` runs the identical steps --
# fetch, build, sign, index, check-tree, doctor, smoke on a real image -- against
# throwaway keys generated inside the job. No environment, no secrets, so a pull
# request from a fork reaches all of it and the feed's key is nowhere near.
#
# What it still cannot prove is that the real key works. That is what the publish
# job is for: publish.yml calls the same file without `dry-run`, with the signing
# keys reached through `environment: feed`.

# `workflow_dispatch` is load-bearing, not a convenience for re-running by hand. It
# is how EVERY update branch gets checked, and for a trusted one it is the only run
# the commit will ever have.
#
# GitHub holds the `pull_request` run of a pull request a bot opened: "when a
# workflow using `GITHUB_TOKEN` creates or updates a pull request, the resulting
# `pull_request` event creates workflow runs in an approval-required state". Not this
# repository's `fork-pr-contributor-approval` policy -- relaxed to
# `first_time_contributors_new_to_github` at repository and organisation level at
# once, the bot's #60 still came back `attempt 1 = action_required` (run
# 33966648498), and both policies were put back. Measured on #45 as well: attempt 1
# created 2026-09-02 and never ran, attempt 2 started two days later once a human
# triggered it. With required checks on `main` such a pull request is BLOCKED for as
# long as nobody looks -- issue #53.
#
# So `check-updates.sh` opens no pull request for an update whose author signature it
# already trusts. It pushes `update/<package>-<version>` and dispatches this
# workflow on it; `tools/land-updates.sh` fast-forwards `main` onto that commit on a
# later hourly run once these checks are green, and `main`'s branch protection
# refuses the push with GH006 if they are not. An untrusted update still gets a pull
# request, and this dispatch is what makes its checks report at all.
#
# GitHub's own exception is why a dispatch works where the other events do not:
# "`workflow_dispatch` and `repository_dispatch` events always create workflow runs".
# Check runs bind to a commit rather than to an event, so a run dispatched on the
# branch reports `check / build` and `check / check` against the very commit the push
# is evaluated against -- which is what the branch protection reads.
#
# Nothing about that path reaches a key. `dry-run: true` below is a constant, and
# `feed.yml`'s publish job is gated on `if: !inputs.dry-run` -- not on the event and
# not on the ref -- so a dispatch cannot open the `feed` environment any more than a
# pull request can.
on:
  pull_request:
  workflow_dispatch:

# One run per branch PER TRIGGER, and the second half of that is the load-bearing
# part. A newer push to the same branch should still supersede the run it makes
# obsolete, which is what a per-branch group buys.
#
# What it must NOT do is let the two triggers above cancel each other. They can both
# fire for the same commit -- when approval turns out not to be required, the
# `pull_request` run starts and `check-updates.sh` dispatches a second run of the same
# thing -- and a shared group made the dispatch cancel it. That looks like a saving and
# is a trap: a cancelled check run STAYS on the pull request. Measured on #49 --
#
#   check / build  | completed success   | run 33895864611  (the dispatch)
#   check / build  | completed cancelled | run 33895851525  (what it cancelled)
#
# -- and with both present the pull request read `check / build  fail` and stayed
# BLOCKED with a green dispatch sitting right there. Since the whole reason the
# dispatch exists is that a `pull_request` run may be held in `action_required`, a
# shared group could cancel a run that had not started and block the branch for good.
#
# Two duplicate runs cost an hour of runners. A pull request nobody can merge costs
# more, and does not announce itself.
concurrency:
  group: check-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The same block the publish caller needs, and not a mistake. A called
    # workflow is validated as a whole, so a caller granting less than any of its
    # jobs declares fails at startup instead of skipping that job -- and feed.yml
    # has a publish job that deploys to Pages. feed.yml's check job narrows itself
    # back to `contents: read`, so nothing that actually runs here holds any of it.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    # Pinned to a release, not tracked at @main. This repository signs what it
    # publishes; the workflow that shapes the signing should move when someone
    # changes this line, not whenever an unrelated repository is pushed to.
    uses: owfeed/owfeed/.github/workflows/feed.yml@v0.5.0
    with:
      owfeed-version: v0.4.5
      dry-run: true
      pre-build: for d in packages/*/; do ./tools/fetch.sh "$d"; done
      post-index: ./tools/check-tree.sh && ./tools/check-origin.sh && ./tools/sources.sh
      # The last gate, and the only one that asks apk rather than telling it:
      # install the feed on a real OpenWrt image, following the published
      # snippet, and prove `apk add` needs no --allow-untrusted. Both lines,
      # because a feed serving two and testing one is a feed serving one.
      smoke-releases: "25.12 24.10"
