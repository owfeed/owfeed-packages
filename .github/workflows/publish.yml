name: Publish

# The same reusable workflow `pr.yml` calls, in the mode that publishes.
#
# It was written out by hand until the environment question was answered: a called
# job declares `environment: feed`, and nothing in GitHub's documentation says
# whose `feed` that is -- this repository's, where the signing keys live, or
# owfeed's, where no such environment exists. Measured rather than guessed: a
# probe workflow reporting an environment variable set to a different value in
# each repository came back with this one's, and the signing secrets scoped to
# this environment reached the called job at their real length. The environment
# resolves against the caller. The keys stay where they are and the pipeline is
# owfeed's.
#
# What that buys: a fix to the shape of a publish reaches this feed by moving one
# pinned tag, and the pull-request check runs the identical file.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    permissions:
      # A called workflow can only narrow these, never widen them, so the caller
      # grants what the publish job needs. `actions: read` is deploy-pages
      # resolving the build job's artifact through the Actions API.
      contents: read
      pages: write
      id-token: write
      actions: read
    # Pinned to a release, not tracked at @main. This repository signs what it
    # publishes; the workflow that shapes the signing should move when someone
    # changes this line, not whenever an unrelated repository is pushed to.
    uses: owfeed/owfeed/.github/workflows/feed.yml@v0.5.0
    # So the publish job can read OWFEED_SIGN_KEY and OWFEED_USIGN_KEY from the
    # `feed` environment. They are environment secrets, not repository ones --
    # the hourly update job and every pull-request check are outside that scope
    # and cannot reach them.
    secrets: inherit
    with:
      owfeed-version: v0.4.5
      pre-build: for d in packages/*/; do ./tools/fetch.sh "$d"; done
      post-index: ./tools/check-tree.sh && ./tools/check-origin.sh && ./tools/sources.sh
      # Both lines, because a feed serving two and testing one is a feed serving
      # one. This is the only gate that asks apk rather than telling it: install
      # from the built index on a real OpenWrt image and prove `apk add` needs no
      # --allow-untrusted.
      smoke-releases: "25.12 24.10"
